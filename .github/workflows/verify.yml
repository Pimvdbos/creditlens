name: Verify frozen CreditLens release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::htmltools
            any::ggplot2
            any::glmnet
            any::Matrix
            any::pROC
            any::digest
            any::base64enc
      - name: Check saved model, behavior, assets and documentation
        run: Rscript scripts/verify.R
